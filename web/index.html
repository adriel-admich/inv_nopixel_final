<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Inventory - NoPixel</title><link rel="stylesheet" href="style.css"></head><body><main id="app" class="hidden"><div class="container left"><div class="inventory-panel"><header><h2>MOCHILA</h2><span id="player-weight">0 / 0 kg</span></header><div class="status-bar"><div class="bar"><i id="player-progress"></i></div><span id="player-slots">0 / 0</span></div><section id="player-grid" class="grid grid-6" data-inventory="player"></section></div></div><div class="hotbar-container"><div class="hotbar-panel"><header><h3>ACESSO RÁPIDO</h3></header><section id="hotbar-grid" class="grid grid-4 hotbar" data-inventory="hotbar"></section></div></div><div class="container right"><div class="inventory-panel" id="dynamic-panel"><header><h2 id="dynamic-title">CHÃO</h2><span id="dynamic-weight">0 / 0 kg</span></header><div class="status-bar"><div class="bar"><i id="dynamic-progress"></i></div><span id="dynamic-slots">0 / 0</span></div><section id="dynamic-grid" class="grid grid-6" data-inventory="dynamic"></section></div></div><div id="context-menu" class="context-menu hidden"><button class="ctx-item" data-action="use">Use</button><button class="ctx-item" data-action="give">Give</button><button class="ctx-item" data-action="drop">Drop</button></div></main><script src="app.js"></script></body></html>
